<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img class="logo-img" src="./images/cloud-logo.svg" alt="" />
        <h1 class="logo-name">CloudBurst</h1>
      </div>
      <form class="search-form">
        <!-- <label for="search">Please enter a location: </label> -->
        <div class="search-bar">
          <!-- <button class="search-btn"><img class="search-icon" src="./images/magnify.svg" alt="" /></button> -->
          <input
            type="text"
            name="search-input"
            id="search-input"
            placeholder="Search location"
          />
          <button class="search-btn">
            <img class="search-icon" src="./images/magnify.svg" alt="" />
          </button>
        </div>
      </form>
      <div class="button-container">
        <button class="farenheit selected">°F</button>
        <button class="celsius">°C</button>
      </div>
    </header>
    <div class="loader-container hidden">
      <span class="loader"></span>
    </div>

    <div class="content">
      <div class="error-container hidden">
        <p class="error">
          Location not found. Please enter a valid address or partial address
          e.g., "San Diego, California"
        </p>
      </div>
      <main class="main hidden">
        <div class="today-container">
          <div class="today-overview-card">
            <h2 class="location-name"></h2>
            <div class="today-temp">
              <img class="today-icon" />
              <span class="temp"></span>
              <span class="temp-unit"></span>
            </div>
            <div class="today-conditions"></div>
            <div class="today-date">
              <div class="day"></div>
              <div class="hour"></div>
            </div>
          </div>
          <section class="day-grid-container">
            <div class="day-card">
              <div class="title">
                <img src="./images/humidity.svg" alt="Humidity" /> Humidity:
              </div>
              <div class="humidity value"></div>
            </div>
            <div class="day-card">
              <div class="title">
                <img src="./images/precipitation.svg" alt="Precipitation" />
                Chance of Rain:
              </div>
              <div class="precipitation value"></div>
            </div>
            <div class="day-card">
              <div class="title">
                <img src="./images/windspeed.svg" alt="Wind" /> Wind:
              </div>
              <span class="windspeed value"></span>
              <span class="speed-unit"></span>
            </div>
            <div class="day-card">
              <div class="title">
                <img src="./images/uv-index.svg" alt="UV Index" /> UV Index:
              </div>
              <div class="uv-index value"></div>
            </div>
            <div class="day-card">
              <div class="title">
                <img src="./images/sunrise.svg" alt="Sunrise" />Sunrise:
              </div>
              <div class="sunrise value"></div>
            </div>
            <div class="day-card">
              <div class="title">
                <img src="./images/sunset.svg" alt="Sunset" />Sunset:
              </div>
              <div class="sunset value"></div>
            </div>
          </div>
        </section>
        <h1 class="week-info-title">7 Day Forecast</h1>

        <div class="week-grid-container"></div>
        <div></div>
      </main>
    </div>
  </body>
</html>
