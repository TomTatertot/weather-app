<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <h1>Weather </h1>
      <form class="search-form">
        <!-- <label for="search">Please enter a location: </label> -->
        <div class="search-bar">
          <img class="search-icon" src="../images/magnify.svg" alt="">
          <input type="text" name="search-input" id="search-input" />
          
        </div>
      </form>
    </header>
    <div class="content">
      <main class="main">
        <div class="main__top">
          <div class="main__top-left">
            <h1 class="location-header"></h1>
            <img class="current-icon">
            <div class="current-temp"></div>
            <div class="current-condition"></div>
            <div class="current-day"></div>
            <div class="current-hour"></div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
